# Builds the site and publishes it to GitHub Pages.
#
# One workflow, not two. There used to be a separate "deploy on push" and
# "refresh the data on a timer", and they disagreed: the timer rebuilt the
# catalog from USGS and deployed it, while a push rebuilt the site from the
# catalog committed in the repo -- so any code change silently rolled the site's
# data back to whatever was last committed. Every run now does the same thing in
# the same order, whatever set it off.
#
# The data under web/public/data is still committed. It is not what gets
# deployed -- the pipeline overwrites it on every run -- but it is what `npm run
# dev` uses locally, and it is the fallback if USGS cannot be reached.

name: Build and deploy

on:
  push:
    branches: [main]
  # Every fifteen minutes. The browser polls the USGS one-day feed itself, so
  # new events appear between runs -- but they arrive unclassified, and after a
  # large earthquake the aftershocks are counted as separate mainshocks until a
  # rebuild has declustered them. That is what this is for, and it is why the
  # loop is fast.
  #
  # Fifteen minutes is affordable because the expensive parts are not on this
  # path: see the stamps in the refresh step. A full run is a couple of minutes;
  # the loop is about twenty seconds of pipeline.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  # write, not read: a harvest that finds new moment tensors commits them back
  # to pipeline/mw.csv. A GITHUB_TOKEN push does not start another workflow run,
  # so this cannot loop.
  contents: write
  pages: write
  id-token: write

# Not cancel-in-progress: a run that is part-way through a backfill has spent
# ten minutes on sequential USGS requests, and killing it wastes them.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.refresh.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The 62 MB SQLite mirror is the only expensive state, and it never leaves
      # CI. A cache miss costs one full backfill, which is why restore-keys fall
      # back to any earlier snapshot rather than starting from nothing.
      - name: Restore catalog mirror
        uses: actions/cache/restore@v4
        with:
          path: |
            data/catalog.sqlite
            data/.stamps
          key: comcat-${{ github.run_id }}
          restore-keys: comcat-

      # continue-on-error so that a USGS outage cannot block a code change from
      # shipping. If any of this fails the next step puts the committed catalog
      # back, and the site deploys with data that is stale rather than broken.
      #
      # Not everything runs every time. Measured on a real run: fetch 2s,
      # magnitudes 10s, decluster 18s, build 1s, context 116s. Only the first,
      # third and fourth have to keep up with a new earthquake; the other two
      # chase things that move over days and months, and running them every
      # quarter of an hour would be four minutes of work and a lot of traffic
      # aimed at other people's servers for no change in what is on the page.
      - name: Refresh the catalog from USGS
        id: refresh
        continue-on-error: true
        run: |
          set -e
          STAMPS=data/.stamps
          mkdir -p "$STAMPS"
          NOW=$(date -u +%s)
          # due <name> <seconds> -- true if never done, or done longer ago than that.
          due() { [ ! -f "$STAMPS/$1" ] || [ $(( NOW - $(cat "$STAMPS/$1") )) -ge "$2" ]; }
          mark() { echo "$NOW" > "$STAMPS/$1"; }

          FRESH=0
          if [ -f data/catalog.sqlite ]; then
            python3 pipeline/fetch.py
          else
            echo "::notice::No cached mirror; running a full backfill."
            python3 pipeline/fetch.py --backfill
            FRESH=1
          fi

          # Moment tensors arrive over days to weeks, and ComCat's preferred
          # magnitude for a new large earthquake is already Mww within minutes --
          # which fetch.py picks up. This harvest is for the events where Mw is
          # not the preferred magnitude, which is a historical problem.
          # A rebuilt mirror has no Mw of its own, and the routine harvest only
          # covers the last two years -- so before pipeline/mw.csv existed, a
          # cache miss left everything earlier on ComCat's preferred magnitude,
          # which switches from Ms/mb to Mw around 1984. That silently knocked
          # about a quarter of the M6+ events out of the 1970s and biased every
          # comparison since. It happened, on 19 August 2026, and nothing caught
          # it.
          #
          # pipeline/mw.csv is the fix: 25,778 values in the repo, seeded into
          # the mirror by magnitudes.py before it fetches anything. A rebuilt
          # mirror gets the whole history back in a second, and then only has to
          # chase the last two years like any other run. Seeding is unconditional
          # and cheap, so a run that skips the harvest still gets it.
          if [ "$FRESH" = "1" ]; then
            echo "::notice::Fresh mirror; seeding Mw from pipeline/mw.csv."
          fi
          if [ "$FRESH" = "1" ] || due magnitudes 21600; then
            python3 pipeline/magnitudes.py --start $(( $(date -u +%Y) - 1 ))
            mark magnitudes
          else
            python3 pipeline/magnitudes.py --seed-only
            echo "Moment magnitudes harvested within the last 6h; skipping the fetch."
          fi

          python3 pipeline/decluster.py
          python3 pipeline/build.py

          # The homogenised share is the canary, and it repairs rather than warns.
          #
          # M6+ runs at 99.5% on Mw once the harvest has been done. It fell to
          # 2.9% on 19 August 2026, when a cache-key change missed, the backfill
          # branch rebuilt the mirror from scratch, and the routine harvest only
          # covered the last two years. Everything earlier reverted to ComCat's
          # preferred magnitude, which switches from Ms/mb to Mw around 1984 --
          # knocking a quarter of the M6+ events out of the 1970s and biasing
          # every comparison since. The deploy published it without complaint.
          share() {
            python3 - <<'PY'
          import json
          m = json.load(open("web/public/data/meta.json"))
          t = [x for x in m["tiers"] if x["threshold"] == 6][0]
          print(int(100 * t.get("homogenised", 0) / max(1, t["count"])))
          PY
          }
          # If the seed and the two-year harvest between them still leave the
          # record short, mw.csv is missing or stale -- re-harvest everything,
          # which also rewrites the file for the commit step below.
          if [ "$(share)" -lt 90 ]; then
            echo "::warning::M6+ is only $(share)% on Mw; harvesting the whole record."
            python3 pipeline/magnitudes.py --start 1970
            mark magnitudes
            python3 pipeline/decluster.py
            python3 pipeline/build.py
          fi
          # Captured first, and checked. Calling share() inside the test meant a
          # raise -- a truncated meta.json, or no M6 tier at all -- printed
          # nothing, so the test read [ "" -lt 90 ], which exits 2 with
          # "integer expression expected". A non-zero exit in an if condition
          # does not trip set -e, so the guard was skipped and the run
          # published: it failed open against exactly the malformed catalog it
          # exists to catch.
          SHARE="$(share)" || { echo "::error::Could not read the homogenised share."; exit 1; }
          case "$SHARE" in
            ''|*[!0-9]*) echo "::error::Homogenised share unreadable: '$SHARE'"; exit 1 ;;
          esac
          echo "M6+ homogenised share: $SHARE%"
          if [ "$SHARE" -lt 90 ]; then
            echo "::error::Mw homogenisation still missing; not publishing this catalog."
            exit 1
          fi


          # Global temperature, sunspots and the Oklahoma record. All three are
          # monthly at best and this is 116s of the run, so it goes daily. A
          # failure costs three panels on the correlations page, not the build.
          if due context 86400; then
            if python3 pipeline/context.py; then mark context;
            else echo "::warning::Context datasets unavailable."; fi
          else
            echo "Context datasets refreshed within the last 24h; skipping."
          fi

          # The mirror is 62 MB and the cache is a 10 GB bucket with
          # least-recently-used eviction. Saving it 96 times a day would push
          # everything else out, and there is no need: fetch.py catches up from
          # whatever it restores using updatedafter, so an hour-old mirror costs
          # one slightly larger delta.
          if due mirror 3600; then
            echo "save=true" >> "$GITHUB_OUTPUT"
            mark mirror
          fi

      - name: Fall back to the committed catalog
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Pipeline failed. Deploying the catalog committed in the repo."
          git checkout -- web/public/data
          AGE=$(python3 - <<'PY'
          import json, datetime
          m = json.load(open("web/public/data/meta.json"))
          built = datetime.datetime.fromisoformat(m["generated"])
          now = datetime.datetime.now(datetime.timezone.utc)
          print(int((now - built).total_seconds() // 86400))
          PY
          )
          echo "::warning::Committed catalog is ${AGE} days old."
          echo "fallback_age=${AGE}" >> "$GITHUB_ENV"

      # The harvested Mw values are the one piece of state that cannot be
      # rebuilt from a ComCat download -- they come from a separate 145 MB
      # QuakeML crawl. Keeping them only in the CI cache is what made the 19
      # August regression possible, so they go in the repo. Sorted plain text:
      # a harvest that finds four new tensors is a four-line diff.
      - name: Commit any newly harvested magnitudes
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: |
          if git diff --quiet -- pipeline/mw.csv; then
            echo "No new moment magnitudes."
            exit 0
          fi
          git diff --numstat -- pipeline/mw.csv \
            | awk '{print "  " $1 " added, " $2 " removed"}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/mw.csv
          git commit -m "Harvest moment magnitudes"
          git pull --rebase --autostash
          git push

      - name: Save catalog mirror
        if: steps.refresh.outcome == 'success' && steps.refresh.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/catalog.sqlite
            data/.stamps
          key: comcat-${{ github.run_id }}

      # A project page is served from /<repo>/, a user page or a custom domain
      # from /. Vite needs to know which, or every asset and data file 404s.
      # web/public/CNAME is the file that makes this a custom domain, so it is
      # also the thing that decides the base.
      - name: Work out the base path
        id: base
        run: |
          if [[ -f web/public/CNAME ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "::notice::Custom domain: $(cat web/public/CNAME)"
          elif [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        working-directory: web
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A failed pipeline used to leave the run green. continue-on-error sets the
  # step's conclusion to success, so the deliberate "not publishing this
  # catalog" exit above was invisible: no red run, and no email for a
  # scheduled failure. The site would serve the committed fallback, ageing
  # silently, while every run reported success.
  #
  # This runs after the deploy rather than before it, so the fallback still
  # ships -- a USGS outage must not block a code change from reaching the
  # site, which is what continue-on-error is for -- and the run still ends
  # red so somebody hears about it.
  alert:
    needs: [build, deploy]
    if: always() && needs.build.outputs.refresh == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The catalog pipeline failed. The site was deployed from the catalog committed in the repo, which does not advance until a run succeeds."
          exit 1
